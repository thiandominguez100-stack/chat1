<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Hablemos</title>
<style>
:root{--bg:#0b0b0c;--sf:#141416;--tx:#f2f2f3;--mu:#8e8e93;--ln:#262629;--in:#1d1d20;--gr:#3a3a3f;--own:#e9e9ea;--owntx:#0b0b0c;--f:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
@media(prefers-color-scheme:light){:root{--bg:#f2f2f4;--sf:#fff;--tx:#111;--mu:#6b6b70;--ln:#e3e3e6;--in:#efeff1;--gr:#1c1c1e;--own:#1c1c1e;--owntx:#fff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}body{font:15px/1.4 var(--f);color:var(--tx);background:var(--bg)}
button{font:inherit;color:inherit}[hidden]{display:none!important}
.f{width:100%;padding:12px 14px;font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--ln);border-radius:10px;margin:6px 0}.f:focus{border-color:var(--mu);outline:0}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--gr);color:#fff;font-weight:600;cursor:pointer;margin-top:8px}.btn.g{background:var(--in);color:var(--tx)}
.err{color:#ff6b6b;min-height:1.3em;margin:4px 0}.note{color:var(--mu);font-size:.82rem}
.av{width:46px;height:46px;border-radius:50%;color:#fff;font-weight:600;font-size:1.15rem;display:grid;place-items:center;flex:none}.av.big{width:96px;height:96px;font-size:2.6rem;margin:auto}.av.sm{width:38px;height:38px;font-size:1rem}
#login{min-height:100%;display:grid;place-items:center;padding:20px;background:var(--bg)}
.lc{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:30px 24px;width:min(400px,100%)}.lc h1{margin:0 0 4px;font-size:2rem}
#app{height:100%;display:grid;grid-template-columns:76px 360px 1fr;background:var(--bg)}
#rail{background:var(--sf);border-right:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0}
#rail .lg{width:42px;height:42px;border-radius:12px;background:var(--tx);color:var(--bg);margin-bottom:14px;display:grid;place-items:center;font-weight:800}
.nb{width:56px;border:0;background:none;border-radius:10px;padding:8px 0;font-size:.68rem;color:var(--mu);cursor:pointer}.nb span{display:block;font-size:1.3rem;filter:grayscale(1)}.nb.on{background:var(--in);color:var(--tx);font-weight:600}
#side{background:var(--sf);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0;min-width:0}
.pn{display:flex;flex-direction:column;min-height:0;flex:1}
.ph{display:flex;align-items:center;padding:18px 16px 8px}.ph h2{margin:0;flex:1;font-size:1.4rem}.ph button{width:38px;height:38px;border-radius:10px;border:0;background:var(--gr);color:#fff;font-size:1.3rem;cursor:pointer}
.sc{overflow:auto;flex:1}.pad{padding:0 16px 16px}
.it{display:flex;gap:12px;align-items:center;padding:10px 16px;cursor:pointer}.it:hover,.it.on{background:var(--in)}
.mid{flex:1;min-width:0}.mid b{display:block}.mid span{display:block;color:var(--mu);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{text-align:right;color:var(--mu);font-size:.72rem}.dot{display:block;width:10px;height:10px;border-radius:50%;background:var(--tx);margin:6px 0 0 auto}
.ring{padding:3px;border-radius:50%;background:var(--tx);flex:none}.ring.vi{background:var(--ln)}.ring .av{border:3px solid var(--sf)}
.lbl{padding:12px 16px 4px;color:var(--mu);font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.vacio{margin:auto;text-align:center;color:var(--mu);padding:30px}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
#ph0{margin:auto;text-align:center;color:var(--mu)}#ph0 b{display:block;font-size:1.3rem;color:var(--tx)}
#cv{display:flex;flex-direction:column;height:100%;min-height:0}
.ct{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--sf);border-bottom:1px solid var(--ln)}
.ct .t2{flex:1;min-width:0;cursor:pointer}.ct .t2 b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ct small{color:var(--mu)}
.ib{width:40px;height:40px;border-radius:10px;border:0;background:var(--in);cursor:pointer;font-size:1.05rem;filter:grayscale(1)}
#back{display:none}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:5px}
.m{max-width:min(78%,520px);background:var(--sf);border:1px solid var(--ln);border-radius:14px 14px 14px 4px;padding:7px 12px 5px;align-self:flex-start;overflow-wrap:anywhere}
.m.yo{background:var(--own);color:var(--owntx);border-color:var(--own);align-self:flex-end;border-radius:14px 14px 4px 14px}
.m b{display:block;font-size:.76rem;color:var(--mu)}.m span{white-space:pre-wrap}.m small{opacity:.6;font-size:.66rem;margin-left:10px;float:right;margin-top:6px}
.mi{display:block;max-width:100%;max-height:300px;border-radius:10px;margin:2px 0 4px;cursor:zoom-in}
.ac{clear:both;padding-top:4px}.ac button{border:0;background:#8883;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.8rem;color:inherit}
.emj{display:flex;gap:4px;padding:6px 12px;background:var(--sf);border-top:1px solid var(--ln);overflow:auto}.emj button{border:0;background:none;font-size:1.5rem;cursor:pointer}
.comp{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--ln);align-items:center}
.comp input{flex:1;border:1px solid var(--ln);border-radius:10px;padding:12px 14px;font:inherit;background:var(--in);color:var(--tx)}.comp .ib.s{background:var(--tx);color:var(--bg);filter:none}
.pf{text-align:center;padding:10px 0 16px}.pf h3{margin:10px 0 4px}.num{border:0;background:var(--in);padding:9px 16px;border-radius:99px;font-weight:600;cursor:pointer;letter-spacing:.04em}
.emo{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.emo button{width:44px;height:44px;border-radius:10px;border:2px solid transparent;background:var(--in);font-size:1.3rem;cursor:pointer}.emo button.on{border-color:var(--tx)}
.pad label{font-weight:600;font-size:.85rem}
.ov{position:fixed;inset:0;z-index:50;background:#000d;display:flex;align-items:center;justify-content:center;flex-direction:column}
#sv{background:#000}.sbars{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:4px}.sbars i{flex:1;height:3px;background:#fff4;border-radius:3px;overflow:hidden}.sbars i b{display:block;height:100%;width:0;background:#fff}
.shd{position:absolute;top:calc(24px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;align-items:center;gap:10px;color:#fff;z-index:2}.shd div{flex:1}.shd button{border:0;background:#fff3;color:#fff;border-radius:10px;width:38px;height:38px;cursor:pointer}
#sbody{width:min(480px,100%);height:min(100%,860px);display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:1.7rem;font-weight:600;padding:80px 28px;position:relative}
#sbody img{max-width:100%;max-height:100%;border-radius:10px}#sbody p{position:absolute;bottom:50px;left:20px;right:20px;font-size:1.05rem;text-shadow:0 1px 4px #000}
.stp{position:absolute;top:70px;bottom:70px;width:35%;z-index:1}
#call{background:#0b0b0c;color:#fff;gap:14px}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#lv{position:absolute;right:14px;top:14px;width:110px;border-radius:12px;z-index:2;background:#000;border:2px solid #fff3}
.ci{z-index:2;text-align:center}.ci h2{margin:12px 0 4px}.cb{z-index:2;display:flex;gap:16px;position:absolute;bottom:calc(36px + env(safe-area-inset-bottom,0px))}
.cb button{width:60px;height:60px;border-radius:50%;border:0;background:#fff2;color:#fff;font-size:1.4rem;cursor:pointer}.cb .rd{background:#d93636}.cb .gn{background:#2fa55f}.cb .off{background:#fff;color:#000}
dialog{border:1px solid var(--ln);border-radius:16px;width:min(360px,92vw);padding:22px;font-family:var(--f);background:var(--sf);color:var(--tx)}dialog::backdrop{background:#0009}dialog{max-height:92vh;overflow:auto}
.sw{display:flex;gap:8px;margin:8px 0}.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--ln);cursor:pointer}.sw button.on{border-color:var(--tx)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:90;max-width:90%;text-align:center}
@media(max-width:859px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #rail{grid-row:2;flex-direction:row;justify-content:space-around;padding:4px 0 calc(4px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--ln)}#rail .lg{display:none}
  #side{border-right:0}#main{display:none;grid-row:1/3}
  #app.co #main{display:flex}#app.co #side,#app.co #rail{display:none}
  #back{display:block}#lv{width:84px}
}
</style>
</head>
<body>
<section id="login" hidden>
  <div class="lc"><h1>Hablemos</h1>
    <p>Chats, estados y llamadas para todos. Elegí tu nombre de usuario.</p>
    <input class="f" id="nick" maxlength="20" placeholder="Nombre de usuario" autocomplete="off" autocapitalize="none">
    <p class="err" id="lerr"></p><button class="btn" id="entrar">Entrar</button>
    <p class="note" style="margin-top:14px">⚠️ No compartas datos personales. Los chats no son privados: no los uses para secretos.</p></div>
</section>

<div id="app" hidden>
  <nav id="rail"><div class="lg">H</div>
    <button class="nb on" data-t="chats"><span>💬</span>Chats</button>
    <button class="nb" data-t="est"><span>🌈</span>Estados</button>
    <button class="nb" data-t="ag"><span>📇</span>Contactos</button>
    <button class="nb" data-t="llam"><span>📞</span>Llamadas</button>
    <button class="nb" data-t="perf"><span>🙂</span>Perfil</button></nav>
  <aside id="side">
    <section class="pn" id="p-chats"><div class="ph"><h2>Chats</h2><button id="mas" aria-label="Nuevo">＋</button></div><div class="pad"><input class="f" id="bq" placeholder="Buscar chats"></div><div class="sc" id="lista"></div></section>
    <section class="pn" id="p-est" hidden><div class="ph"><h2>Estados</h2><button id="nest" aria-label="Nuevo estado">＋</button></div><div class="sc" id="lest"></div></section>
    <section class="pn" id="p-ag" hidden><div class="ph"><h2>Contactos</h2><button id="nag" aria-label="Agendar">＋</button></div><div class="sc" id="lag"></div></section>
    <section class="pn" id="p-llam" hidden><div class="ph"><h2>Llamadas</h2></div><div class="sc" id="llam"></div></section>
    <section class="pn" id="p-perf" hidden><div class="ph"><h2>Mi perfil</h2></div><div class="sc pad" id="perf"></div></section>
  </aside>
  <main id="main">
    <div id="ph0"><div style="font-size:3.5rem">💬</div><b>Hablemos</b>Elegí un chat para empezar</div>
    <div id="cv" hidden>
      <div class="ct"><button class="ib" id="back" aria-label="Volver">←</button><div id="cav"></div><div class="t2" id="ctit"><b id="ct"></b><small id="cs"></small></div><button class="ib" id="c1" hidden aria-label="Llamar">📞</button><button class="ib" id="c2" hidden aria-label="Videollamada">🎥</button></div>
      <div id="msgs"></div><div class="emj" id="emj" hidden></div>
      <div class="comp"><button class="ib" id="bimg" aria-label="Foto">📷</button><button class="ib" id="bemo" aria-label="Emojis">😊</button><input id="txt" maxlength="500" placeholder="Escribí un mensaje" autocomplete="off"><button class="ib s" id="env" aria-label="Enviar">➤</button></div>
    </div>
  </main>
</div>

<input type="file" id="fi" accept="image/*" hidden>
<div class="ov" id="lb" hidden><img id="lbi" style="max-width:96%;max-height:96%;border-radius:12px"></div>
<div class="ov" id="sv" hidden><div class="sbars" id="sbars"></div>
  <div class="shd"><div id="sav"></div><div><b id="snm"></b><br><small id="sti"></small></div><button id="sdel" hidden>🗑️</button><button id="sx">✕</button></div>
  <div class="stp" style="left:0" id="sprev"></div><div class="stp" style="right:0" id="snext"></div><div id="sbody"></div></div>
<div class="ov" id="call" hidden><video id="rv" autoplay playsinline></video><video id="lv" autoplay muted playsinline hidden></video>
  <div class="ci"><div id="cavt"></div><h2 id="cnm"></h2><div id="cst"></div></div>
  <div class="cb"><button id="bno" class="rd" hidden aria-label="Rechazar">✕</button><button id="bok" class="gn" hidden aria-label="Aceptar">📞</button>
    <button id="bmic" hidden aria-label="Silenciar">🎤</button><button id="bcam" hidden aria-label="Cámara">📷</button><button id="bend" class="rd" hidden aria-label="Colgar">📵</button></div></div>

<dialog id="pfd"><div id="pfb" style="text-align:center"></div><div id="pfa"></div><button class="btn g" id="pfx">Cerrar</button></dialog>
<dialog id="menu"><b>Nuevo</b>
  <button class="btn" data-m="dm">💬 Chat por número o usuario</button><button class="btn" data-m="grupo">👥 Crear un grupo</button><button class="btn" data-m="unir">🔑 Unirme con código</button><button class="btn g" data-m="x">Cancelar</button></dialog>
<dialog id="dlg"><b id="pt"></b><input class="f" id="pi" autocomplete="off"><p class="err" id="pe"></p><button class="btn" id="pok">Aceptar</button><button class="btn g" id="pno">Cancelar</button></dialog>
<dialog id="nes"><b>Nuevo estado</b><textarea class="f" id="et" maxlength="140" rows="4" placeholder="¿Qué estás pensando?"></textarea>
  <div class="sw" id="esw"></div><button class="btn" id="epub">Publicar texto</button><button class="btn g" id="efoto">📷 Subir una foto</button><button class="btn g" id="eno">Cancelar</button></dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,deleteField,arrayRemove,addDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,limitToLast,where,arrayUnion} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const FIREBASE={apiKey:"AIzaSyDaJT2oM4y2YaPM5i5XlZ6MWRWKNJI6-nI",authDomain:"buffet-4p.firebaseapp.com",projectId:"buffet-4p",storageBucket:"buffet-4p.firebasestorage.app",messagingSenderId:"925951291927",appId:"1:925951291927:web:a13f6762d25a0713c56252"};
const db=getFirestore(initializeApp(FIREBASE));

const $=s=>document.querySelector(s),K=n=>n.toLowerCase();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const color=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%100;return `hsl(0 0% ${26+h%22}%)`};
const av=(n,e,c='')=>`<div class="av ${c}" style="background:${color(n)}">${esc(e||Array.from(n)[0].toUpperCase())}</div>`;
const fnum=n=>String(n||'').replace(/(\d{3})(?=\d)/g,'$1 ');
const hora=t=>{const d=new Date(t),h=d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});return d.toDateString()===new Date().toDateString()?h:d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})+' '+h};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
const BG=['#111114','linear-gradient(135deg,#232326,#4a4a50)','linear-gradient(135deg,#3a3a3f,#8e8e93)','#2b2b2e','linear-gradient(135deg,#000,#3a3a3f)','linear-gradient(135deg,#55555b,#1d1d20)'];
const EMO=['😀','😂','😍','🥳','😎','😭','🙏','👍','🔥','❤️','💜','🎉','😅','🤔','👀','✨'];

let me=ls('hb_me',null),read=ls('hb_read',{}),gen={},mine=[],cur=null,curS=null,msgs=[],unM=null,primero=true,ultimo=0,ests=[],hist=[],tabAct='chats';
const uid=()=>{let u=ls('hb_uid',null);if(!u){u=crypto.randomUUID();sv('hb_uid',u)}return u};

/* ===== Entrar ===== */
$('#entrar').onclick=async()=>{
  const n=$('#nick').value.trim(),e=$('#lerr');
  if(!/^\w{3,20}$/.test(n))return e.textContent='Usá 3 a 20 letras, números o _ (sin espacios ni tildes).';
  try{
    const r=doc(db,'usuarios',K(n)),s=await getDoc(r),u=uid();
    if(s.exists()&&s.data().uid!==u)return e.textContent='Ese nombre ya está en uso. Probá otro.';
    await setDoc(r,{nick:n,uid:u,creado:Date.now()},{merge:true});me={nick:n,key:K(n),uid:u};sv('hb_me',me);iniciar();
  }catch(x){console.error(x);e.textContent='No se pudo conectar. Revisá tu internet y las reglas de Firebase.'}
};
$('#nick').onkeydown=e=>{if(e.key==='Enter')$('#entrar').click()};
async function nuevoNum(){for(let i=0;i<8;i++){const n=String(Math.floor(1e8+Math.random()*9e8));const q=await getDocs(query(collection(db,'usuarios'),where('num','==',n)));if(q.empty)return n}throw new Error('sin-numero')}
async function asignar(){try{const n=await nuevoNum();await setDoc(doc(db,'usuarios',me.key),{num:n},{merge:true});me.num=n;sv('hb_me',me);pintarPerfil();toast('Número generado')}catch(e){console.error(e);toast('No se pudo generar ('+(e.code||e.message)+')')}}

async function iniciar(){
  $('#login').hidden=true;$('#app').hidden=false;me.key=K(me.nick);
  let u={};
  try{
    const r=doc(db,'usuarios',me.key);u=(await getDoc(r)).data()||{};
    if(!u.num){u.num=await nuevoNum();await setDoc(r,{num:u.num},{merge:true})}
  }catch(e){console.error(e);u.num=u.num||'';toast('Faltan permisos en Firebase: publicá las reglas nuevas')}
  me={...me,num:u.num||me.num||'',emoji:u.emoji||me.emoji||'',bio:u.bio||me.bio||'',ag:u.ag||me.ag||{},sinEstados:u.sinEstados||me.sinEstados||[]};sv('hb_me',me);pintarPerfil();pintarLista();pintarEst();pintarLlam();pintarAg();
  const er=n=>e=>{console.error(n,e);toast('Error al cargar '+n+' ('+(e.code||e.message)+')')};
  setDoc(doc(db,'salas','general'),{tipo:'general',nombre:'General'},{merge:true}).catch(()=>{});
  onSnapshot(doc(db,'salas','general'),d=>{gen=d.data()||{};pintarLista()},er('chats'));
  onSnapshot(query(collection(db,'salas'),where('miembros','array-contains',me.key)),s=>{mine=s.docs.map(d=>({id:d.id,...d.data()}));pintarLista()},er('chats'));
  onSnapshot(query(collection(db,'salas'),where('cat','==','estado')),s=>{ests=s.docs.map(d=>({id:d.id,...d.data()}));pintarEst()},er('estados'));
  onSnapshot(query(collection(db,'salas'),where('par','array-contains',me.key)),s=>{
    hist=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.t-a.t);pintarLlam();
    s.docChanges().forEach(ch=>{if(ch.type==='removed')return;const c={id:ch.doc.id,...ch.doc.data()};
      if(c.para===me.key&&c.estado==='sonando'&&Date.now()-c.t<90000&&!pc&&!entr){entr=c;uiCall('entrante',c.deNick,c.video);timbre(true)}
      else if(entr&&entr.id===c.id&&c.estado!=='sonando'&&!pc){entr=null;cierraCall()}});
  },er('llamadas'));
}

/* ===== Navegación ===== */
function tab(t){tabAct=t;document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.t===t));['chats','est','ag','llam','perf'].forEach(x=>$('#p-'+x).hidden=x!==t)}
$('#rail').onclick=e=>{const b=e.target.closest('.nb');if(b)tab(b.dataset.t)};

/* ===== Chats ===== */
const titulo=s=>s.tipo==='general'?'General':s.tipo==='dm'?((s.nicks||{})[(s.miembros||[]).find(m=>m!==me.key)]||'Chat'):(s.nombre||'Grupo');
function pintarLista(){
  const q=K($('#bq').value||'');

const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};

function timbre(on){clearInterval(tim);if(!on)return;const b=()=>{try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=660;g.gain.value=.12;o.start();o.stop(actx.currentTime+.4)}catch(e){}};b();tim=setInterval(b,1500)}

function cierraCall(){timbre(false);clearInterval(tmr);clearTimeout(tpo);uns.forEach(f=>f());uns=[];pend=[];if(mic)mic.getTracks().forEach(t=>t.stop());mic=null;if(pc){pc.close();pc=null}

  pc.ontrack=e=>{$('#rv').srcObject=e.streams[0]};
  pc.onicecandidate=e=>{if(e.candidate)addDoc(collection(db,'salas',id,'mensajes'),{de:me.key,c:JSON.stringify(e.candidate)}).catch(()=>{})};
  pc.onconnectionstatechange=()=>{if(!pc)return;const s=pc.connectionState;
    if(s==='connected'){timbre(false);clearTimeout(tpo);const t0=Date.now();clearInterval(tmr);tmr=setInterval(()=>{const x=Math.floor((Date.now()-t0)/1000);$('#cst').textContent=String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')},1000)}
    if(s==='failed'){toast('No se pudo conectar la llamada (la red bloquea la conexión directa)');colgar()}};
  uns.push(onSnapshot(collection(db,'salas',id,'mensajes'),s=>{s.docChanges().forEach(ch=>{if(ch.type==='added'){const x=ch.doc.data();if(x.de!==me.key)pend.push(JSON.parse(x.c))}});flush()}));

async function llamar(k,nick,video){
  if(!k)return toast('No se encontró a la otra persona');
  if(pc||entr)return toast('Ya estás en una llamada');
  try{mic=await navigator.mediaDevices.getUserMedia({audio:true,video:!!video})}catch(e){return toast('Necesito permiso de micrófono'+(video?' y cámara':''))}

  try{
    const of=await pc.createOffer();await pc.setLocalDescription(of);
    await setDoc(doc(db,'salas',id),{par:[me.key,k],de:me.key,para:k,deNick:me.nick,paraNick:nick,video:!!video,estado:'sonando',offer:{type:of.type,sdp:of.sdp},t:Date.now()});
  }catch(e){console.error(e);toast('No se pudo iniciar la llamada ('+(e.code||e.message)+')');return cierraCall()}
  uns.push(onSnapshot(doc(db,'salas',id),async d=>{const c=d.data();if(!c||!pc)return;
    if(c.answer&&!pc.remoteDescription){timbre(false);await pc.setRemoteDescription(c.answer);uiCall('activa',nick,video);flush()}
    if(c.estado==='rechazada'){toast('Llamada rechazada');cierraCall()}if(c.estado==='terminada')cierraCall()}));
  tpo=setTimeout(async()=>{if(pc&&!pc.remoteDescription){await updateDoc(doc(db,'salas',id),{estado:'perdida'}).catch(()=>{});toast('No contestó');cierraCall()}},40000);
}

  armar(c.id);if(c.video){$('#lv').srcObject=mic;$('#lv').hidden=false}uiCall('activa',c.deNick,c.video);
  try{
    await pc.setRemoteDescription(c.offer);flush();const an=await pc.createAnswer();await pc.setLocalDescription(an);
    await updateDoc(doc(db,'salas',c.id),{answer:{type:an.type,sdp:an.sdp},estado:'activa'});
  }catch(e){console.error(e);toast('No se pudo atender la llamada ('+(e.code||e.message)+')');return cierraCall()}
  uns.push(onSnapshot(doc(db,'salas',c.id),d=>{const x=d.data();if(x&&x.estado==='terminada')cierraCall()}));
}
async function rechazar(){const c=entr;if(c)await updateDoc(doc(db,'salas',c.id),{estado:'rechazada'}).catch(()=>{});cierraCall()}
async function colgar(){const id=callId;if(id)await updateDoc(doc(db,'salas',id),{estado:'terminada'}).catch(()=>{});cierraCall()}
$('#bok').onclick=aceptar;$('#bno').onclick=rechazar;$('#bend').onclick=colgar;
$('#bmic').onclick=e=>{if(!mic)return;const t=mic.getAudioTracks()[0];t.enabled=!t.enabled;e.currentTarget.classList.toggle('off',!t.enabled)};
$('#bcam').onclick=e=>{if(!mic)return;const t=mic.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;e.currentTarget.classList.toggle('off',!t.enabled)};
const otro=()=>{const k=(curS.miembros||[]).find(m=>m!==me.key);return[k,(curS.nicks||{})[k]||k]};
$('#c1').onclick=()=>{const[k,n]=otro();llamar(k,n,false)};$('#c2').onclick=()=>{const[k,n]=otro();llamar(k,n,true)};
function pintarLlam(){
  $('#llam').innerHTML=hist.length?hist.map(c=>{const sal=c.de===me.key,k=sal?c.para:c.de,n=sal?c.paraNick:c.deNick,perdida=!sal&&['perdida','rechazada','sonando'].includes(c.estado)&&c.estado!=='activa'&&c.estado!=='terminada';
    return `<div class="it"><div class="av" style="background:${color(n)}">${esc(Array.from(n)[0].toUpperCase())}</div><div class="mid"><b>${esc(n)}</b><span style="${perdida?'color:#e5384f':''}">${sal?'↗ Saliente':perdida?'↙ Perdida':'↙ Entrante'} · ${c.video?'Video':'Voz'} · ${hora(c.t)}</span></div><button class="ib" data-k="${esc(k)}" data-n="${esc(n)}" data-v="0">📞</button><button class="ib" data-k="${esc(k)}" data-n="${esc(n)}" data-v="1" style="margin-left:6px">🎥</button></div>`}).join(''):'<div class="vacio">Todavía no hiciste ni recibiste llamadas.<br>Abrí un chat privado y tocá 📞 o 🎥.</div>';
}
$('#llam').onclick=e=>{const b=e.target.closest('button[data-k]');if(b)llamar(b.dataset.k,b.dataset.n,b.dataset.v==='1')};

/* ===== Perfil ===== */
function pintarPerfil(){
  const E=['','😀','😎','🦊','🐼','🐸','🦄','🔥','🌈','🎧','⚡','🍕'];
  $('#perf').innerHTML=`<div class="pf">${av(me.nick,me.emoji,'big')}<h3>${esc(me.nick)}</h3><button class="num" id="cnum">📞 ${me.num?fnum(me.num):'Sin número'}</button><p class="note">Tu número de Hablemos es único. Compartilo para que te encuentren.</p>${me.num?'':'<button class="btn" id="gnum">Generar mi número</button>'}</div>
  <label>Info</label><input class="f" id="bio" maxlength="80" placeholder="Ej: Disponible" value="${esc(me.bio)}"><label>Avatar</label>
  <div class="emo">${E.map(x=>`<button data-e="${x}" class="${x===me.emoji?'on':''}">${x||'Aa'}</button>`).join('')}</div><button class="btn g" id="salir">Cerrar sesión</button>`;
}
$('#perf').onclick=async e=>{
  if(e.target.id==='gnum')return asignar();
  if(e.target.closest('#cnum')&&navigator.clipboard)navigator.clipboard.writeText(me.num).then(()=>toast('Número copiado')).catch(()=>{});
  const b=e.target.closest('[data-e]');if(b){me.emoji=b.dataset.e;sv('hb_me',me);pintarPerfil();updateDoc(doc(db,'usuarios',me.key),{emoji:me.emoji}).catch(()=>{})}
  if(e.target.id==='salir'&&confirm('¿Cerrar sesión? Podés volver a entrar con el mismo nombre en este dispositivo.')){try{localStorage.removeItem('hb_me')}catch(x){}location.reload()}
};
$('#perf').onchange=e=>{if(e.target.id==='bio'){me.bio=e.target.value.trim();sv('hb_me',me);updateDoc(doc(db,'usuarios',me.key),{bio:me.bio}).catch(()=>{})}};

if(me)iniciar();else $('#login').hidden=false;
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
